{% extends "base.html" %}
{% block content %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  .analytics-card {
    border-radius: 16px;
    animation: fadeUp 0.6s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>

<!-- 🔙 BACK TO ADMIN PANEL -->
<div class="mb-3">
  <a href="{% url 'admin_pumps' %}" class="btn btn-outline-secondary btn-sm">
    <i class="fas fa-arrow-left me-1"></i> Back to Admin Panel
  </a>
</div>

<h3 class="fw-bold mb-4">
  <i class="fas fa-chart-line text-success me-1"></i>
  Admin Analytics
</h3>

<!-- ================= STATS CARDS ================= -->
<div class="row g-4 mb-4">

  <div class="col-md-3">
    <div class="card analytics-card shadow-sm p-3">
      <h6>Total Pumps</h6>
      <h3>{{ total_pumps }}</h3>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card analytics-card shadow-sm p-3">
      <h6>Active Pumps</h6>
      <h3>{{ active_pumps }}</h3>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card analytics-card shadow-sm p-3">
      <h6>Total Bookings</h6>
      <h3>{{ total_bookings }}</h3>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card analytics-card shadow-sm p-3">
      <h6>Revenue</h6>
      <h3>₹{{ revenue }}</h3>
    </div>
  </div>

</div>

<!-- ================= CHARTS ================= -->
<div class="row g-4">

  <!-- BAR CHART: BOOKINGS OVERVIEW -->
  <div class="col-md-6">
    <div class="card analytics-card shadow-sm p-3">
      <h6 class="fw-semibold mb-3">
        <i class="fas fa-chart-bar me-1"></i>
        Booking Overview
      </h6>
      <canvas id="bookingBarChart"></canvas>
    </div>
  </div>

  <!-- HISTOGRAM STYLE BAR CHART -->
  <div class="col-md-6">
    <div class="card analytics-card shadow-sm p-3">
      <h6 class="fw-semibold mb-3">
        <i class="fas fa-chart-column me-1"></i>
        Revenue Histogram
      </h6>
      <canvas id="revenueHistogram"></canvas>
    </div>
  </div>

</div>

<script>
  /* ===== BAR CHART: BOOKINGS ===== */
  const bookingCtx = document.getElementById('bookingBarChart');

  new Chart(bookingCtx, {
    type: 'bar',
    data: {
      labels: ['Paid', 'Cancelled'],
      datasets: [{
        label: 'Bookings Count',
        data: [{{ paid_bookings }}, {{ cancelled_bookings }}],
        backgroundColor: ['#28a745', '#dc3545'],
        borderRadius: 8,
        barThickness: 50
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: true,
          ticks: { stepSize: 1 }
        }
      }
    }
  });

  /* ===== HISTOGRAM STYLE REVENUE ===== */
  const revenueCtx = document.getElementById('revenueHistogram');

  new Chart(revenueCtx, {
    type: 'bar',
    data: {
      labels: ['Total Revenue'],
      datasets: [{
        label: 'Revenue (₹)',
        data: [{{ revenue }}],
        backgroundColor: '#0d6efd',
        borderRadius: 10,
        barThickness: 80
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>

{% endblock %}
