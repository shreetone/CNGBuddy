{% extends "base.html" %}
{% block content %}

<style>
  /* ===== LOGIN ANIMATION ===== */
  .login-card {
    animation: fadeSlide 0.8s ease;
    border-radius: 16px;
  }

  @keyframes fadeSlide {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .login-icon {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #28a745, #20c997);
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin: 0 auto 10px;
  }

  .form-control {
    border-radius: 10px;
  }

  .btn-login {
    border-radius: 30px;
    padding: 10px;
    font-weight: 600;
  }
</style>

<div class="row justify-content-center align-items-center" style="min-height:70vh;">
  <div class="col-md-5 col-lg-4">

    <div class="card shadow-lg border-0 login-card mt-4">
      <div class="card-body p-4">

        <!-- ICON -->
        <div class="login-icon">
          <i class="fas fa-user-lock"></i>
        </div>

        <h3 class="text-center fw-bold mb-3">Login to CNG Buddy</h3>
        <p class="text-center text-muted small mb-4">
          Access your dashboard and bookings
        </p>

        {% if form.errors %}
          <div class="alert alert-danger text-center py-2">
            Invalid username or password
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <!-- USERNAME -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter username"
                   required>
          </div>

          <!-- PASSWORD -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter password"
                   required>
          </div>

          <!-- BUTTON -->
          <button class="btn btn-success w-100 btn-login">
            Login
          </button>
        </form>

        <hr>

        <p class="text-center mb-0 small">
          Don’t have an account?
          <a href="{% url 'register' %}" class="fw-semibold text-decoration-none">
            Sign up
          </a>
        </p>

      </div>
    </div>

  </div>
</div>

{% endblock %}
