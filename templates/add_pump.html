{% extends "base.html" %}
{% block content %}

<style>
  /* ===== ADD PUMP PAGE ===== */
  .add-pump-card {
    animation: fadeUp 0.6s ease;
    border-radius: 16px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .add-pump-card label {
    font-size: 14px;
    font-weight: 600;
  }

  .add-pump-card input {
    height: 44px;
    border-radius: 10px;
    font-size: 14px;
  }

  .add-pump-card input::placeholder {
    color: #999;
  }

  .btn-save {
    border-radius: 24px;
    font-weight: 600;
    padding: 10px;
  }
</style>

<!-- ================= HEADER ================= -->
<div class="mb-4">
  <h3 class="fw-bold mb-1">
    <i class="fas fa-plus-circle text-success me-1"></i>
    Add New Pump
  </h3>
  <small class="text-muted">
    Enter CNG pump details carefully
  </small>
</div>

<!-- ================= FORM CARD ================= -->
<div class="card shadow-sm border-0 add-pump-card">
  <div class="card-body p-4 p-md-4">

    <form method="post">
      {% csrf_token %}

      <!-- Pump Name -->
      <div class="mb-3">
        <label class="form-label">Pump Name</label>
        <input type="text"
               name="name"
               class="form-control"
               placeholder="Enter pump name"
               required>
      </div>

      <!-- Address -->
      <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text"
               name="address"
               class="form-control"
               placeholder="Enter pump address"
               required>
      </div>

      <!-- Latitude -->
      <div class="mb-3">
        <label class="form-label">Latitude</label>
        <input type="number" step="any"
               name="lat"
               class="form-control"
               placeholder="e.g. 18.5204"
               required>
      </div>

      <!-- Longitude -->
      <div class="mb-3">
        <label class="form-label">Longitude</label>
        <input type="number" step="any"
               name="lng"
               class="form-control"
               placeholder="e.g. 73.8567"
               required>
      </div>

      <!-- Image -->
      <div class="mb-4">
        <label class="form-label">Image Filename</label>
        <input type="text"
               name="image"
               class="form-control"
               placeholder="example: pump1.jpg">
        <small class="text-muted">
          Image should exist in <code>static/</code> folder
        </small>
      </div>

      <!-- BUTTON -->
      <button class="btn btn-primary w-100 btn-save">
        <i class="fas fa-save me-1"></i> Add Pump
      </button>

    </form>

  </div>
</div>

{% endblock %}
