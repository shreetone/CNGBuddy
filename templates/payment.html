{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-5">

    <div class="card shadow border-0 rounded-4 p-4">
      <h4 class="fw-bold mb-3 text-center">Payment</h4>

      <p><b>Pump:</b> {{ booking.pump_name }}</p>
      <p><b>Date:</b> {{ booking.date }}</p>
      <p><b>Time:</b> {{ booking.time_slot }}</p>
      <p><b>Amount:</b> ₹{{ booking.amount }}</p>

      <hr>

      <form method="post">
        {% csrf_token %}

        <div class="form-check mb-3">
          <input class="form-check-input"
                 type="radio"
                 checked
                 disabled>
          <label class="form-check-label fw-semibold">
            Cash on Delivery (Pay at Pump)
          </label>
        </div>

        <button class="btn btn-success w-100">
          Confirm Booking
        </button>
      </form>
    </div>

  </div>
</div>

{% endblock %}
