{% extends "base.html" %}
{% block content %}

<style>
  /* ===== CONTACT ADMIN STYLING ===== */
  .contact-header {
    animation: fadeDown 0.5s ease;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-15px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .contact-card {
    border-radius: 16px;
    animation: fadeUp 0.6s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  table th {
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  table td {
    font-size: 14px;
    vertical-align: middle;
  }

  .table-hover tbody tr:hover {
    background-color: #f3f7fb;
  }

  .msg-box {
    max-width: 420px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .msg-box:hover {
    white-space: normal;
  }
</style>

<!-- 🔙 BACK TO ADMIN PANEL -->
<div class="mb-3">
  <a href="{% url 'admin_pumps' %}" class="btn btn-outline-secondary btn-sm">
    <i class="fas fa-arrow-left me-1"></i> Back to Admin Panel
  </a>
</div>

<!-- ================= HEADER ================= -->
<div class="d-flex justify-content-between align-items-center mb-4 contact-header">
  <div>
    <h3 class="fw-bold mb-1">
      <i class="fas fa-phone text-info me-1"></i>
      Contact Messages
    </h3>
    <small class="text-muted">
      Messages submitted from contact page
    </small>
  </div>
</div>

<!-- ================= TABLE ================= -->
<div class="card shadow-sm border-0 contact-card">
  <div class="card-body p-0">

    <table class="table table-hover align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th class="ps-4">Name</th>
          <th>Email</th>
          <th>Message</th>
          <th>Date</th>
        </tr>
      </thead>

      <tbody>
        {% for c in contacts %}
        <tr>
          <td class="ps-4 fw-semibold">
            <i class="fas fa-user text-secondary me-1"></i>
            {{ c.name }}
          </td>

          <td>
            <i class="fas fa-envelope text-primary me-1"></i>
            {{ c.email }}
          </td>

          <td>
            <div class="msg-box text-muted">
              {{ c.message }}
            </div>
          </td>

          <td class="text-muted small">
            <i class="fas fa-clock me-1"></i>
            {{ c.created_at }}
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="4" class="text-center py-4 text-muted">
            <i class="fas fa-inbox me-1"></i>
            No contact messages yet
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

  </div>
</div>

{% endblock %}
