{% extends "base.html" %}
{% block content %}

<style>
  /* ===== SUPPORT PAGE STYLING ===== */
  .support-card {
    border-radius: 18px;
    animation: fadeUp 0.6s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .support-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #0d6efd, #6610f2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 26px;
    margin: 0 auto 10px;
  }

  .support-card textarea {
    border-radius: 12px;
    font-size: 15px;
    resize: none;
  }

  .btn-support {
    border-radius: 24px;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .btn-support:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(13, 110, 253, 0.35);
  }
</style>

<div class="row justify-content-center align-items-center" style="min-height:70vh;">
  <div class="col-md-6 col-lg-5">

    <div class="card shadow-lg border-0 support-card mt-4">
      <div class="card-body p-4 p-md-4">

        <!-- HEADER -->
        <div class="text-center mb-3">
          <div class="support-icon">
            <i class="fas fa-headset"></i>
          </div>
          <h4 class="fw-bold mb-1">Support</h4>
          <p class="text-muted small mb-0">
            Tell us your issue and we’ll get back to you shortly
          </p>
        </div>

        <hr>

        <!-- SUPPORT FORM -->
        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">
              Describe your issue
            </label>
            <textarea name="message"
                      class="form-control"
                      rows="5"
                      placeholder="Explain the problem you are facing..."
                      required></textarea>
            <small class="text-muted">
              Please provide as much detail as possible
            </small>
          </div>

          <!-- ACTION BUTTONS -->
          <div class="d-flex justify-content-between align-items-center mt-4">
            <a href="{% url 'dashboard' %}"
               class="btn btn-outline-secondary btn-sm rounded-pill">
              <i class="fas fa-arrow-left me-1"></i> Back
            </a>

            <button type="submit"
                    class="btn btn-primary btn-sm px-4 btn-support">
              <i class="fas fa-paper-plane me-1"></i> Submit Ticket
            </button>
          </div>
        </form>

      </div>
    </div>

  </div>
</div>

{% endblock %}
