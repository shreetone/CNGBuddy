{% extends "base.html" %}
{% block content %}

<style>
  /* ===== SUPPORT ADMIN STYLING ===== */
  .support-header {
    animation: fadeDown 0.5s ease;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-15px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .support-card {
    border-radius: 16px;
    animation: fadeUp 0.6s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  table th {
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  table td {
    font-size: 14px;
    vertical-align: middle;
  }

  .table-hover tbody tr:hover {
    background-color: #f4f8fb;
  }

  .msg-box {
    max-width: 480px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .msg-box:hover {
    white-space: normal;
  }
</style>

<!-- ================= HEADER ================= -->
<div class="d-flex justify-content-between align-items-center mb-4 support-header">
  <div>
    <h3 class="fw-bold mb-1">
      <i class="fas fa-headset text-warning me-1"></i>
      Support Tickets
    </h3>
    <small class="text-muted">
      Issues reported by users
    </small>
  </div>

  <!-- 🔙 BACK TO ADMIN PANEL -->
  <a href="{% url 'admin_pumps' %}"
     class="btn btn-outline-secondary btn-sm">
    ← Back to Admin Panel
  </a>
</div>

<!-- ================= TABLE ================= -->
<div class="card shadow-sm border-0 support-card">
  <div class="card-body p-0">

    <table class="table table-hover align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th class="ps-4">User</th>
          <th>Message</th>
          <th>Date</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>

      <tbody>
      {% for t in tickets %}
        <tr>

          <td class="ps-4 fw-semibold">
            <i class="fas fa-user text-secondary me-1"></i>
            {{ t.user }}
          </td>

          <td>
            <div class="msg-box text-muted">
              {{ t.message }}
            </div>
          </td>

          <td class="text-muted small">
            <i class="fas fa-clock me-1"></i>
            {{ t.created_at }}
          </td>

          <!-- DELETE -->
          <td class="text-center">
            <a href="{% url 'delete_ticket' t.id %}"
               class="btn btn-sm btn-outline-danger"
               onclick="return confirm('Delete this support ticket?')">
              <i class="fas fa-trash"></i>
            </a>
          </td>

        </tr>
      {% empty %}
        <tr>
          <td colspan="4" class="text-center py-4 text-muted">
            <i class="fas fa-inbox me-1"></i>
            No support tickets
          </td>
        </tr>
      {% endfor %}
      </tbody>

    </table>

  </div>
</div>

{% endblock %}
