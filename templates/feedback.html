{% extends "base.html" %}
{% block content %}

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

      <div class="card shadow-lg border-0 rounded-4 overflow-hidden">

        <!-- Header -->
        <div class="bg-success text-white text-center py-3">
          <h4 class="fw-bold mb-0">Share Your Feedback</h4>
          <small>Your opinion helps us improve</small>
        </div>

        <!-- Body -->
        <div class="card-body p-4">

          <form method="post">
            {% csrf_token %}

            <!-- Rating -->
            <div class="mb-3">
              <label class="fw-semibold mb-1">Rating</label>
              <select name="rating" class="form-select" required>
                <option value="">Select Rating</option>
                <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                <option value="4">⭐⭐⭐⭐ Very Good</option>
                <option value="3">⭐⭐⭐ Good</option>
                <option value="2">⭐⭐ Average</option>
                <option value="1">⭐ Poor</option>
              </select>
            </div>

            <!-- Comment -->
            <div class="mb-4">
              <label class="fw-semibold mb-1">Comment</label>
              <textarea
                name="comment"
                class="form-control"
                rows="4"
                placeholder="Share your experience..."
                required></textarea>
            </div>

            <!-- Submit -->
            <button class="btn btn-success w-100 fw-semibold py-2">
              Submit Feedback
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

{% endblock %}
